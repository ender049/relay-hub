<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay Hub 登录页</title>
<style>
html,body{margin:0;height:100%;background:#0f172a;color:#e5edf8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center}
.box{display:flex;align-items:center;gap:12px;font-size:14px;color:#cbd5e1}
.ld{width:18px;height:18px;border:2px solid #334155;border-top-color:#3b82f6;border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><span class="ld"></span><span>正在打开登录页...</span></div>
</body>
</html>
